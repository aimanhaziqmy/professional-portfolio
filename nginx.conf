# Define rate limiting execution zone
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m; # 5 requests per minute

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Apply rate limiting to /admin routes
    # Note: Since this is an SPA, the initial load of /admin is just index.html.
    # True API rate limiting should be on the backend, but this limits how fast 
    # someone can refresh the admin page itself.
    location /admin {
        limit_req zone=admin_limit burst=10 nodelay;
        try_files $uri $uri/ /index.html;
    }
    
    location /login {
        limit_req zone=admin_limit burst=10 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
